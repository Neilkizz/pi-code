name: Desktop CI

on:
  push:
    branches: [main, "improvement-*", "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Protocol, Pi Host, React, and Rust
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
            packages/pi-agent-host/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install legacy and shared tooling
        run: npm ci

      - name: Install Pi Host dependencies
        run: npm ci --prefix packages/pi-agent-host

      - name: Install Desktop dependencies
        run: npm ci --prefix apps/desktop

      - name: Verify Desktop
        run: npm run desktop:verify
